<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球天气查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }
  .container { width: 100%; max-width: 720px; }
  h1 { text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 2px; }
  .subtitle { text-align: center; color: rgba(255,255,255,.55); margin: 8px 0 28px; font-size: 14px; }
  .search-box { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-box input {
    flex: 1; padding: 14px 18px; font-size: 16px; border: none; border-radius: 14px;
    background: rgba(255,255,255,.12); color: #fff; outline: none;
    backdrop-filter: blur(8px);
  }
  .search-box input::placeholder { color: rgba(255,255,255,.4); }
  .search-box button {
    padding: 14px 26px; font-size: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff;
    cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .search-box button:active { transform: scale(.97); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .chips button {
    padding: 8px 16px; font-size: 13px; border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  }
  .chips button:hover { background: rgba(255,255,255,.18); }
  .card {
    background: rgba(255,255,255,.1); border-radius: 20px; padding: 28px;
    backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.12);
    margin-bottom: 20px;
  }
  .hero { text-align: center; }
  .hero .city { font-size: 22px; font-weight: 600; }
  .hero .country { font-size: 13px; color: rgba(255,255,255,.55); margin-top: 4px; }
  .hero .icon { font-size: 72px; margin: 12px 0 4px; }
  .hero .temp { font-size: 64px; font-weight: 200; }
  .hero .desc { font-size: 18px; margin: 6px 0 18px; color: rgba(255,255,255,.85); }
  .meta { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .meta div { text-align: center; }
  .meta .v { font-size: 20px; font-weight: 600; }
  .meta .k { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 4px; }
  .updated { text-align: center; font-size: 12px; color: rgba(255,255,255,.4); margin-top: 16px; }
  .forecast-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
  .day {
    background: rgba(255,255,255,.07); border-radius: 14px; padding: 14px 8px;
    text-align: center; border: 1px solid rgba(255,255,255,.08);
  }
  .day .d { font-size: 13px; color: rgba(255,255,255,.7); }
  .day .i { font-size: 34px; margin: 8px 0; }
  .day .t { font-size: 15px; font-weight: 600; }
  .day .p { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 6px; }
  .loading, .error { text-align: center; padding: 30px; font-size: 15px; }
  .error { color: #ffb4b4; }
  .hidden { display: none; }
  .footer { margin-top: 30px; text-align: center; font-size: 12px; color: rgba(255,255,255,.35); }
</style>
</head>
<body>
<div class="container">
  <h1>🌍 全球天气查询</h1>
  <p class="subtitle">输入任意城市名，实时获取天气与未来预报</p>

  <div class="search-box">
    <input id="cityInput" type="text" placeholder="例如：东京、巴黎、New York…" onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">查询</button>
  </div>
  <div class="chips">
    <button onclick="quick('北京')">北京</button>
    <button onclick="quick('上海')">上海</button>
    <button onclick="quick('东京')">东京</button>
    <button onclick="quick('首尔')">首尔</button>
    <button onclick="quick('巴黎')">巴黎</button>
    <button onclick="quick('伦敦')">伦敦</button>
    <button onclick="quick('纽约')">纽约</button>
    <button onclick="quick('悉尼')">悉尼</button>
  </div>

  <div id="loading" class="card loading hidden">正在获取天气…</div>
  <div id="error" class="card error hidden"></div>

  <div id="result" class="hidden">
    <div class="card hero">
      <div class="city" id="cityName">–</div>
      <div class="country" id="countryName">–</div>
      <div class="icon" id="wIcon">⛅</div>
      <div class="temp"><span id="wTemp">–</span>°</div>
      <div class="desc" id="wDesc">–</div>
      <div class="meta">
        <div><div class="v" id="wFeels">–</div><div class="k">体感温度</div></div>
        <div><div class="v" id="wHumidity">–</div><div class="k">湿度</div></div>
        <div><div class="v" id="wWind">–</div><div class="k">风速</div></div>
      </div>
      <div class="updated" id="wUpdated"></div>
    </div>

    <div class="card">
      <div class="forecast-title">📅 未来预报</div>
      <div class="days" id="forecastDays"></div>
    </div>
  </div>

  <div class="footer">数据来源 Open-Meteo · 免费全球天气数据</div>
</div>

<script>
function iconFor(code) {
  if (code === 0) return "☀️";
  if (code <= 3) return "⛅";
  if (code === 45 || code === 48) return "🌫️";
  if (code <= 57) return "🌦️";
  if (code <= 67) return "🌧️";
  if (code === 77 || (code >= 71 && code <= 75)) return "🌨️";
  if (code <= 82) return "🌦️";
  if (code <= 86) return "🌨️";
  return "⛈️";
}
function fmtDate(s) {
  const d = new Date(s + "T12:00:00");
  const week = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return s.slice(5) + " " + week;
}
function quick(city) {
  document.getElementById("cityInput").value = city;
  search();
}
async function search() {
  const city = document.getElementById("cityInput").value.trim();
  if (!city) return;
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const result = document.getElementById("result");
  loading.classList.remove("hidden");
  error.classList.add("hidden");
  result.classList.add("hidden");
  try {
    const [w, f] = await Promise.all([
      fetch("/weather?city=" + encodeURIComponent(city)).then(r => {
        if (!r.ok) throw new Error("找不到这座城市，换个名字试试");
        return r.json();
      }),
      fetch("/forecast?city=" + encodeURIComponent(city) + "&days=5").then(r => r.json())
    ]);
    const name = w.city || city;
    document.getElementById("cityName").textContent = name;
    document.getElementById("countryName").textContent = w.country || "";
    document.getElementById("wIcon").textContent = iconFor(w.weather.code);
    document.getElementById("wTemp").textContent = Math.round(w.weather.temperature);
    document.getElementById("wDesc").textContent = w.weather.description;
    document.getElementById("wFeels").textContent = Math.round(w.weather.feels_like) + "°C";
    document.getElementById("wHumidity").textContent = w.weather.humidity + "%";
    document.getElementById("wWind").textContent = w.weather.wind_speed_kmh + " km/h";
    document.getElementById("wUpdated").textContent = "更新于 " + (w.updated_at || "").replace("T", " ");

    const box = document.getElementById("forecastDays");
    box.innerHTML = "";
    f.forecast.forEach(d => {
      const el = document.createElement("div");
      el.className = "day";
      el.innerHTML =
        '<div class="d">' + fmtDate(d.date) + '</div>' +
        '<div class="i">' + iconFor(d.code) + '</div>' +
        '<div class="t">' + Math.round(d.temp_min) + '° / ' + Math.round(d.temp_max) + '°</div>' +
        '<div class="p">' + d.description + ' · 降水' + d.precipitation_probability + '%</div>';
      box.appendChild(el);
    });

    loading.classList.add("hidden");
    result.classList.remove("hidden");
  } catch (e) {
    loading.classList.add("hidden");
    error.textContent = "⚠️ " + e.message;
    error.classList.remove("hidden");
  }
}
// 默认加载一座城市
quick("东京");
</script>
</body>
</html>
